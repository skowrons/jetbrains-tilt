version: '3'

vars:
  GRADLEW: '{{if eq OS "windows"}}./gradlew.bat{{else}}./gradlew{{end}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  build:
    desc: Build the installable plugin ZIP
    cmds:
      - '{{.GRADLEW}} buildPlugin --console=plain {{.CLI_ARGS}}'
      - cmd: |
          for archive in build/distributions/*.zip; do
            if [ -f "$archive" ]; then
              printf 'Plugin ZIP: %s/%s\n' "$PWD" "$archive"
            fi
          done
        silent: true

  test:
    desc: Run integration and LSP tests
    cmds:
      - '{{.GRADLEW}} test --console=plain {{.CLI_ARGS}}'

  verify:
    desc: Verify plugin configuration, ZIP structure and IDE compatibility
    cmds:
      - '{{.GRADLEW}} verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin --console=plain {{.CLI_ARGS}}'

  check:
    desc: Run tests, build and all plugin checks
    cmds:
      - '{{.GRADLEW}} test buildPlugin verifyPluginProjectConfiguration verifyPluginStructure verifyPlugin --console=plain {{.CLI_ARGS}}'

  run:
    desc: Start GoLand with the plugin in a sandbox
    interactive: true
    cmds:
      - '{{.GRADLEW}} runIde --console=plain {{.CLI_ARGS}}'

  clean:
    desc: Remove build outputs
    cmds:
      - '{{.GRADLEW}} clean --console=plain {{.CLI_ARGS}}'
